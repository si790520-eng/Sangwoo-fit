<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeae2">
<meta name="description" content="이상우의 옷장. 옷을 기록하고 마네킹에 입혀 보고, 데이트·마실 코디를 받아요.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="옷장">
<title>이상우 옷장</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="who">이상우 · 179cm</p>
      <h1 id="title">내 옷장</h1>
    </div>
    <button id="backupBtn" class="ghost" type="button">백업</button>
  </header>
  <main id="view"><p class="loading">옷장 여는 중…</p></main>
  <button id="fab" class="fab" type="button">+ 옷 추가</button>
  <nav class="tabs" aria-label="메뉴">
    <button class="tab on" type="button" data-act="tab" data-tab="closet"><span class="ti">👕</span><span>옷장</span></button>
    <button class="tab" type="button" data-act="tab" data-tab="fit"><span class="ti">🧍</span><span>피팅<span id="fitCount" class="count" hidden>0</span></span></button>
    <button class="tab" type="button" data-act="tab" data-tab="reco"><span class="ti">✨</span><span>추천</span></button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="js/data.js"></script>
<script src="js/color.js"></script>
<script src="js/db.js"></script>
<script src="js/draw.js"></script>
<script src="js/reco.js"></script>
<script src="js/app.js"></script>
</body>
</html>
