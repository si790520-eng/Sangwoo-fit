<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe8">
<meta name="description" content="이상우의 퇴근 후 집밥. 레시피, 냉장고 수량, 불 세기, 썰기, 계량.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="집밥">
<title>상우 집밥</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button id="back" class="back" type="button" hidden aria-label="뒤로">‹</button>
    <div>
      <p class="eyebrow">이상우 · 벤치업 · 퇴근 후</p>
      <h1 id="title">레시피</h1>
    </div>
  </header>
  <main id="view"></main>
  <nav class="nav" aria-label="메뉴">
    <button type="button" data-tab="list" data-hash="#/" class="on"><span class="ti">🍲</span><span>레시피</span></button>
    <button type="button" data-tab="now" data-hash="#/now"><span class="ti">✅</span><span>지금</span></button>
    <button type="button" data-tab="fridge" data-hash="#/fridge"><span class="ti">🧊</span><span>냉장고</span></button>
    <button type="button" data-tab="guide" data-hash="#/guide"><span class="ti">📖</span><span>가이드</span></button>
  </nav>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="js/measure.js"></script>
<script src="js/recipes.js"></script>
<script src="js/more-recipes.js"></script>
<script src="js/more-b.js"></script>
<script src="js/more-c.js"></script>
<script src="js/app.js"></script>
</body>
</html>
